name: Portal CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser E2E
        if: ${{ vars.NEXA_PORTAL_URL != '' }}
        run: npm run test:e2e
        env:
          NEXA_PORTAL_URL: ${{ vars.NEXA_PORTAL_URL }}
          NEXA_E2E_WORKSPACE: ${{ vars.NEXA_E2E_WORKSPACE }}
          NEXA_E2E_BUYER_EMAIL: ${{ secrets.NEXA_E2E_BUYER_EMAIL }}
          NEXA_E2E_BUYER_PASSWORD: ${{ secrets.NEXA_E2E_BUYER_PASSWORD }}
      - run: npm audit --audit-level=high
