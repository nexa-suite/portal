<main class="security-page" aria-labelledby="security-title"><a routerLink="/sign-in">{{ 'iamSecurity.back' | translate }}</a><h1 id="security-title">{{ 'iamSecurity.resetTitle' | translate }}</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>{{ 'iamSecurity.token' | translate }}<input formControlName="token" autocomplete="off"></label><label>{{ 'iamSecurity.newPassword' | translate }}<input type="password" autocomplete="new-password" formControlName="newPassword"></label><button type="submit" [disabled]="form.invalid || facade.busy()">{{ 'iamSecurity.save' | translate }}</button></form>@if (facade.message()) {<p role="status">{{ facade.message()! | translate }}</p>} @if (facade.error()) {<p role="alert">{{ facade.error()! | translate }}</p>}</main>
