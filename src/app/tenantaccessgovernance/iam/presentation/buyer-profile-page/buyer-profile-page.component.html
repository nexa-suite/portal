<main class="security-page" aria-labelledby="security-title"><h1 id="security-title">{{ 'iamSecurity.profileTitle' | translate }}</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>{{ 'iamSecurity.displayName' | translate }}<input formControlName="displayName" autocomplete="name"></label><label>{{ 'iamSecurity.email' | translate }}<input [value]="facade.profile()?.email" readonly></label><label>{{ 'iamSecurity.phone' | translate }}<input formControlName="phone" autocomplete="tel"></label><label>{{ 'iamSecurity.language' | translate }}<input formControlName="preferredLanguage"></label><label>{{ 'iamSecurity.timezone' | translate }}<input formControlName="timezone"></label><button type="submit" [disabled]="form.invalid || facade.busy()">{{ 'iamSecurity.save' | translate }}</button></form>@if (facade.error()) {<p role="alert">{{ facade.error()! | translate }}</p>}</main>
