<main class="security-page" aria-labelledby="security-title"><a routerLink="/sign-in">{{ 'iamSecurity.back' | translate }}</a><h1 id="security-title">{{ 'iamSecurity.forgotTitle' | translate }}</h1><p>{{ 'iamSecurity.forgotDescription' | translate }}</p><form [formGroup]="form" (ngSubmit)="submit()"><label>{{ 'iamSecurity.email' | translate }}<input type="email" autocomplete="email" formControlName="email"></label><button type="submit" [disabled]="form.invalid || facade.busy()">{{ 'iamSecurity.send' | translate }}</button></form>@if (facade.message()) {<p role="status">{{ facade.message()! | translate }}</p>} @if (facade.error()) {<p role="alert">{{ facade.error()! | translate }}</p>}</main>
